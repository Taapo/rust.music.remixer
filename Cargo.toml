[package]
name = "rust-music-remixer"
version = "0.1.0"
edition = "2024"
description = "Remix / loop a music track to a target length. Single Rust binary, no runtime dependencies."
license = "MIT"

[[bin]]
name = "remix"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0.104"
beat-track-rs = "0.1.2"
clap = { version = "4.6.6", features = ["derive"] }
font8x8 = "0.3.1"
hound = "3.5.1"
mp3lame-encoder = { version = "0.2.5", features = ["std"] }
muxide = "0.2.5"
openh264 = "0.9.8"
rustfft = "6.4.1"
rusty_aac = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
symphonia = "0.5"
